<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烧饼铺用餐区</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a1a;
    --ink-light: #444;
    --ink-faint: #888;
    --paper: #faf8f5;
    --paper-warm: #f5f0e8;
    --paper-card: #fffef9;
    --accent: #8b5e3c;
    --accent-soft: #c4956a;
    --accent-pale: #f0e4d4;
    --line: #e8e0d4;
    --red: #c0392b;
    --shadow: rgba(139,94,60,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── 顶部装饰线 ── */
  .top-stripe {
    height: 3px;
    background: linear-gradient(90deg, var(--accent-pale) 0%, var(--accent) 40%, var(--accent-soft) 70%, var(--accent-pale) 100%);
  }

  /* ── 头部 ── */
  header {
    padding: 48px 40px 36px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    background: var(--paper-card);
    position: relative;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 40px; right: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-soft) 30%, var(--accent-soft) 70%, transparent);
    opacity: .4;
  }
  .site-title {
    font-family: 'Ma Shan Zheng', 'Noto Serif SC', serif;
    font-size: 2rem;
    color: var(--accent);
    letter-spacing: .1em;
    line-height: 1.1;
  }
  .site-sub {
    font-size: .78rem;
    color: var(--ink-faint);
    letter-spacing: .18em;
    margin-top: 6px;
  }
  .header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }
  .btn {
    padding: 8px 18px;
    border-radius: 4px;
    font-size: .82rem;
    font-family: 'Noto Sans SC', sans-serif;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: .05em;
    border: 1px solid;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: #7a5234; }
  .btn-ghost {
    background: transparent;
    color: var(--accent);
    border-color: var(--accent-soft);
  }
  .btn-ghost:hover { background: var(--accent-pale); }

  /* ── 筛选/搜索栏 ── */
  .toolbar {
    padding: 20px 40px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 80;
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    max-width: 360px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 8px 14px 8px 36px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper-card);
    font-size: .84rem;
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--ink);
    outline: none;
    transition: border-color .2s;
  }
  .search-box input:focus { border-color: var(--accent-soft); }
  .search-icon {
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-50%);
    color: var(--ink-faint);
    font-size: .9rem;
  }
  .tag-filter {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tag-chip {
    padding: 5px 12px;
    border-radius: 20px;
    font-size: .76rem;
    cursor: pointer;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-faint);
    transition: all .15s;
    letter-spacing: .04em;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .tag-chip:hover, .tag-chip.active {
    background: var(--accent-pale);
    border-color: var(--accent-soft);
    color: var(--accent);
  }
  .count-label {
    margin-left: auto;
    font-size: .76rem;
    color: var(--ink-faint);
    letter-spacing: .06em;
    white-space: nowrap;
  }

  /* ── 主容器 ── */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 36px 40px 80px;
  }

  /* ── 卡片列表 ── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }
  .card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 24px 22px 20px;
    cursor: pointer;
    transition: all .22s;
    position: relative;
    overflow: hidden;
    animation: fadeUp .35s ease both;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform .22s ease;
  }
  .card:hover {
    border-color: var(--accent-soft);
    box-shadow: 0 4px 18px var(--shadow);
    transform: translateY(-2px);
  }
  .card:hover::before { transform: scaleX(1); }
  .card-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: .68rem;
    letter-spacing: .1em;
    margin-bottom: 10px;
    font-family: 'Noto Sans SC', sans-serif;
  }
  .badge-extra { background: var(--accent-pale); color: var(--accent); }
  .badge-sweet { background: #fde8e8; color: #b94040; }
  .badge-funny { background: #e8f4e8; color: #3a7a3a; }
  .badge-angst { background: #e8eaf6; color: #4a5aa8; }
  .card-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.05rem;
    font-weight: 500;
    line-height: 1.5;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .card-excerpt {
    font-size: .8rem;
    color: var(--ink-faint);
    line-height: 1.8;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-footer {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .card-tag {
    padding: 2px 8px;
    border-radius: 20px;
    font-size: .68rem;
    background: var(--paper-warm);
    color: var(--ink-faint);
    border: 1px solid var(--line);
    letter-spacing: .04em;
  }
  .card-date {
    margin-left: auto;
    font-size: .7rem;
    color: var(--ink-faint);
    letter-spacing: .06em;
  }

  /* ── 空状态 ── */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--ink-faint);
  }
  .empty-icon { font-size: 2.5rem; margin-bottom: 14px; }
  .empty-text { font-size: .88rem; line-height: 1.8; }

  /* ── 模态框：新建番外 ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,26,26,.45);
    backdrop-filter: blur(3px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--paper-card);
    border-radius: 8px;
    width: 100%;
    max-width: 660px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 12px 48px rgba(0,0,0,.18);
    animation: modalIn .25s ease;
  }
  .modal-header {
    padding: 24px 28px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.05rem;
    color: var(--accent);
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    color: var(--ink-faint);
    padding: 2px 6px;
    border-radius: 3px;
    transition: color .15s;
  }
  .modal-close:hover { color: var(--ink); }
  .modal-body { padding: 22px 28px; }
  .form-row {
    margin-bottom: 16px;
  }
  .form-label {
    display: block;
    font-size: .78rem;
    color: var(--ink-light);
    margin-bottom: 6px;
    letter-spacing: .06em;
  }
  .form-input, .form-select, .form-textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    font-size: .84rem;
    font-family: 'Noto Sans SC', sans-serif;
    color: var(--ink);
    outline: none;
    transition: border-color .2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--accent-soft);
  }
  .form-textarea {
    min-height: 200px;
    resize: vertical;
    line-height: 1.85;
  }
  .form-row-inline {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .modal-footer {
    padding: 16px 28px 24px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  /* ── 阅读模态框 ── */
  .read-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26,26,26,.55);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px 40px;
    overflow-y: auto;
  }
  .read-overlay.open { display: flex; }
  .read-modal {
    background: var(--paper-card);
    border-radius: 8px;
    width: 100%;
    max-width: 700px;
    box-shadow: 0 16px 56px rgba(0,0,0,.2);
    animation: modalIn .28s ease;
    position: relative;
    margin: auto;
  }
  .read-header {
    padding: 32px 40px 24px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .read-badge-row {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .read-title {
    font-family: 'Ma Shan Zheng', 'Noto Serif SC', serif;
    font-size: 1.6rem;
    color: var(--ink);
    line-height: 1.4;
    letter-spacing: .05em;
  }
  .read-meta {
    margin-top: 10px;
    font-size: .76rem;
    color: var(--ink-faint);
    letter-spacing: .06em;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .read-close {
    position: absolute;
    top: 24px; right: 28px;
    background: none;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    color: var(--ink-faint);
    padding: 4px 8px;
    border-radius: 4px;
    transition: all .15s;
  }
  .read-close:hover { background: var(--accent-pale); color: var(--accent); }
  .read-body {
    padding: 32px 40px 40px;
  }
  .read-content {
    font-family: 'Noto Serif SC', serif;
    font-size: .96rem;
    line-height: 2.1;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .read-content p { margin-bottom: 1.2em; }
  .read-tags {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .read-actions {
    padding: 16px 40px 28px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    border-top: 1px solid var(--line);
  }

  /* ── 装饰分隔线 ── */
  .divider {
    text-align: center;
    margin: 28px 0 8px;
    position: relative;
    font-size: .7rem;
    color: var(--ink-faint);
    letter-spacing: .2em;
  }
  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%; width: calc(50% - 40px);
    height: 1px;
    background: var(--line);
  }
  .divider::before { left: 0; }
  .divider::after { right: 0; }

  /* ── 动画 ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(.96) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ── 响应式 ── */
  @media (max-width: 640px) {
    header { padding: 32px 20px 24px; }
    .toolbar { padding: 14px 20px; }
    main { padding: 24px 20px 60px; }
    .modal-body, .read-body, .read-header { padding-left: 20px; padding-right: 20px; }
    .read-actions { padding-left: 20px; padding-right: 20px; }
    .read-title { font-size: 1.3rem; }
    .form-row-inline { grid-template-columns: 1fr; }
  }

  /* 小工具 */
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
  .flex-1 { flex: 1; }
</style>
</head>
<body>

<div class="top-stripe"></div>

<header>
  <div>
    <div class="site-title">烧饼铺用餐区</div>
    <div class="site-sub">SIDE STORY ARCHIVE</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost" id="adminLoginBtn" onclick="openLogin()">🔑 管理</button>
    <button class="btn btn-ghost" id="exportBtn" style="display:none" onclick="exportAll()">导出全部</button>
    <button class="btn btn-primary" id="newBtn" style="display:none" onclick="openWrite()">＋ 新建番外</button>
  </div>
</header>

<div class="toolbar">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索标题、内容、标签……" oninput="renderCards()">
  </div>
  <div class="tag-filter" id="tagFilter">
    <button class="tag-chip active" data-filter="all" onclick="setFilter(this,'all')">全部</button>
    <button class="tag-chip" data-filter="甜" onclick="setFilter(this,'甜')">甜</button>
    <button class="tag-chip" data-filter="搞笑" onclick="setFilter(this,'搞笑')">搞笑</button>
    <button class="tag-chip" data-filter="虐" onclick="setFilter(this,'虐')">虐</button>
    <button class="tag-chip" data-filter="暧昧" onclick="setFilter(this,'暧昧')">暧昧</button>
    <button class="tag-chip" data-filter="日常" onclick="setFilter(this,'日常')">日常</button>
  </div>
  <span class="count-label" id="countLabel">— 篇</span>
</div>

<main>
  <div class="card-grid" id="cardGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <div class="empty-icon">📖</div>
    <div class="empty-text">这里还没有番外<br>点击右上角「新建番外」开始记录吧</div>
  </div>
</main>

<!-- 写入/新建 模态框 -->
<div class="modal-overlay" id="writeModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="writeModalTitle">新建番外</div>
      <button class="modal-close" onclick="closeWrite()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label class="form-label">标题</label>
        <input class="form-input" id="fTitle" placeholder="例：我动了谁的蛋糕？">
      </div>
      <div class="form-row-inline">
        <div>
          <label class="form-label">情感基调</label>
          <select class="form-select" id="fType">
            <option value="extra">番外</option>
            <option value="sweet">甜</option>
            <option value="funny">搞笑</option>
            <option value="angst">虐</option>
          </select>
        </div>
        <div>
          <label class="form-label">日期</label>
          <input class="form-input" id="fDate" type="date">
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">标签（逗号分隔）</label>
        <input class="form-input" id="fTags" placeholder="例：甜，日常，暧昧，同居">
      </div>
      <div class="form-row">
        <label class="form-label">摘要（可选，不填则自动取正文开头）</label>
        <input class="form-input" id="fExcerpt" placeholder="一句话概括这篇番外……">
      </div>
      <div class="form-row">
        <label class="form-label">正文</label>
        <textarea class="form-textarea" id="fContent" placeholder="在这里粘贴或撰写番外内容……"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeWrite()">取消</button>
      <button class="btn btn-primary" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>

<!-- 阅读 模态框 -->
<div class="read-overlay" id="readModal">
  <div class="read-modal" id="readModalInner">
    <div class="read-header">
      <div class="read-badge-row" id="rBadge"></div>
      <div class="read-title" id="rTitle"></div>
      <div class="read-meta" id="rMeta"></div>
      <button class="read-close" onclick="closeRead()">✕</button>
    </div>
    <div class="read-body">
      <div class="read-content" id="rContent"></div>
      <div class="read-tags" id="rTags"></div>
    </div>
    <div class="read-actions">
      <button class="btn btn-ghost" id="rEditBtn" style="display:none" onclick="editCurrent()">编辑</button>
      <button class="btn btn-ghost" style="display:none;color:var(--red);border-color:var(--red)" id="rDeleteBtn" onclick="deleteCurrent()">删除</button>
      <button class="btn btn-primary" onclick="closeRead()">关闭</button>
    </div>
  </div>
</div>

<script>
/* ── Supabase 配置 ── */
const SUPABASE_URL = 'https://cggjvgxmfqlzuftnmvho.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnZ2p2Z3htZnFsenVmdG5tdmhvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc3MTY5NTksImV4cCI6MjA2MzI5Mjk1OX0.eyJpc3MiOiJzdXBhYmFzZSJ9';
const sb = {
  async select() {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/entries?select=*&order=created_at.desc`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    return r.json();
  },
  async insert(entry) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/entries`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: JSON.stringify(entry)
    });
    return r.json();
  },
  async update(id, entry) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/entries?id=eq.${id}`, {
      method: 'PATCH',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: JSON.stringify(entry)
    });
    return r.json();
  },
  async remove(id) {
    await fetch(`${SUPABASE_URL}/rest/v1/entries?id=eq.${id}`, {
      method: 'DELETE',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
  }
};

/* ── 密码管理 ── */
const ADMIN_PWD = 'Shaopingpu99';
let isAdmin = false;
function openLogin() {
  if (isAdmin) { adminLogout(); return; }
  const pwd = prompt('请输入管理密码：');
  if (pwd === ADMIN_PWD) {
    isAdmin = true;
    document.getElementById('adminLoginBtn').textContent = '🔓 退出管理';
    document.getElementById('exportBtn').style.display = '';
    document.getElementById('newBtn').style.display = '';
    document.getElementById('rEditBtn').style.display = '';
    document.getElementById('rDeleteBtn').style.display = '';
  } else if (pwd !== null) {
    alert('密码错误');
  }
}
function adminLogout() {
  isAdmin = false;
  document.getElementById('adminLoginBtn').textContent = '🔑 管理';
  document.getElementById('exportBtn').style.display = 'none';
  document.getElementById('newBtn').style.display = 'none';
  document.getElementById('rEditBtn').style.display = 'none';
  document.getElementById('rDeleteBtn').style.display = 'none';
}
function openWrite() {
  if (!isAdmin) return;
  editingId = null;
  document.getElementById('writeModalTitle').textContent = '新建番外';
  document.getElementById('fTitle').value = '';
  document.getElementById('fType').value = 'extra';
  document.getElementById('fDate').value = todayStr();
  document.getElementById('fTags').value = '';
  document.getElementById('fExcerpt').value = '';
  document.getElementById('fContent').value = '';
  document.getElementById('writeModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

/* ── 数据层 ── */
let entries = [];
let currentFilter = 'all';
let editingId = null;
let readingId = null;

function showLoading(on) {
  document.getElementById('countLabel').textContent = on ? '加载中……' : `共 ${getFiltered().length} 篇`;
}

async function load() {
  showLoading(true);
  try {
    const data = await sb.select();
    entries = Array.isArray(data) ? data : [];
  } catch(e) {
    entries = [];
  }
  renderCards();
}

/* ── 筛选 ── */
function setFilter(el, val) {
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentFilter = val;
  renderCards();
}
function getFiltered() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  return entries.filter(e => {
    const matchFilter = currentFilter === 'all' || (e.tags||[]).includes(currentFilter) || e.type === currentFilter;
    if (!matchFilter) return false;
    if (!q) return true;
    return (e.title+e.content+(e.tags||[]).join('')+(e.excerpt||'')).toLowerCase().includes(q);
  });
}

/* ── 渲染卡片 ── */
const typeMap = {
  extra: { cls:'badge-extra', label:'番外' },
  sweet: { cls:'badge-sweet', label:'甜' },
  funny: { cls:'badge-funny', label:'搞笑' },
  angst: { cls:'badge-angst', label:'虐' },
};
function renderCards() {
  const grid = document.getElementById('cardGrid');
  const empty = document.getElementById('emptyState');
  const filtered = getFiltered();
  document.getElementById('countLabel').textContent = `共 ${filtered.length} 篇`;
  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = filtered.map((e, i) => {
    const t = typeMap[e.type] || typeMap.extra;
    const excerpt = e.excerpt || e.content.replace(/\n/g,' ').slice(0,80)+'……';
    const tags = (e.tags||[]).slice(0,4).map(tag=>`<span class="card-tag">${tag}</span>`).join('');
    return `
<div class="card" style="animation-delay:${i*0.04}s" onclick="openRead('${e.id}')">
  <span class="card-badge ${t.cls}">${t.label}</span>
  <div class="card-title">${escHtml(e.title)}</div>
  <div class="card-excerpt">${escHtml(excerpt)}</div>
  <div class="card-footer">
    ${tags}
    <span class="card-date">${e.date||''}</span>
  </div>
</div>`;
  }).join('');
}

/* ── 阅读 ── */
function openRead(id) {
  const e = entries.find(x=>x.id===id);
  if (!e) return;
  readingId = id;
  const t = typeMap[e.type]||typeMap.extra;
  document.getElementById('rBadge').innerHTML = `<span class="card-badge ${t.cls}">${t.label}</span>`;
  document.getElementById('rTitle').textContent = e.title;
  document.getElementById('rMeta').innerHTML = `<span>${e.date||''}</span><span>${(e.tags||[]).join(' · ')}</span>`;
  document.getElementById('rContent').textContent = e.content;
  document.getElementById('rTags').innerHTML = (e.tags||[]).map(tag=>`<span class="card-tag">${tag}</span>`).join('');
  if (isAdmin) {
    document.getElementById('rEditBtn').style.display = '';
    document.getElementById('rDeleteBtn').style.display = '';
  }
  document.getElementById('readModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeRead() {
  document.getElementById('readModal').classList.remove('open');
  document.body.style.overflow = '';
  readingId = null;
}

/* ── 新建 / 编辑 ── */
function closeWrite() {
  document.getElementById('writeModal').classList.remove('open');
  document.body.style.overflow = '';
  editingId = null;
}
function editCurrent() {
  const e = entries.find(x=>x.id===readingId);
  if (!e) return;
  closeRead();
  editingId = e.id;
  document.getElementById('writeModalTitle').textContent = '编辑番外';
  document.getElementById('fTitle').value = e.title;
  document.getElementById('fType').value = e.type||'extra';
  document.getElementById('fDate').value = e.date||todayStr();
  document.getElementById('fTags').value = (e.tags||[]).join('，');
  document.getElementById('fExcerpt').value = e.excerpt||'';
  document.getElementById('fContent').value = e.content;
  document.getElementById('writeModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
async function saveEntry() {
  const title = document.getElementById('fTitle').value.trim();
  const content = document.getElementById('fContent').value.trim();
  if (!title) { alert('请填写标题'); return; }
  if (!content) { alert('请填写正文'); return; }
  const tagsRaw = document.getElementById('fTags').value;
  const tags = tagsRaw.split(/[，,、\s]+/).map(s=>s.trim()).filter(Boolean);
  const entry = {
    id: editingId || uid(),
    title,
    type: document.getElementById('fType').value,
    date: document.getElementById('fDate').value || todayStr(),
    tags,
    excerpt: document.getElementById('fExcerpt').value.trim(),
    content,
  };
  try {
    if (editingId) {
      await sb.update(editingId, entry);
    } else {
      await sb.insert(entry);
    }
    closeWrite();
    await load();
  } catch(e) {
    alert('保存失败，请检查网络');
  }
}

/* ── 删除 ── */
async function deleteCurrent() {
  if (!readingId) return;
  const e = entries.find(x=>x.id===readingId);
  if (!e) return;
  if (!confirm(`确认删除「${e.title}」？此操作不可撤销。`)) return;
  try {
    await sb.remove(readingId);
    closeRead();
    await load();
  } catch(e) {
    alert('删除失败，请检查网络');
  }
}

/* ── 导出 ── */
function exportAll() {
  const json = JSON.stringify(entries, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `fanwai-archive-${todayStr()}.json`;
  a.click();
}

/* ── 工具函数 ── */
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── 点击遮罩关闭 ── */
document.getElementById('writeModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeWrite(); });
document.getElementById('readModal').addEventListener('click', e => { if(e.target===e.currentTarget) closeRead(); });

/* ── 键盘 Esc ── */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeRead(); closeWrite(); }
});

/* ── 初始加载 ── */
load();
</script>
</body>
</html>
